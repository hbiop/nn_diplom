<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Нейронная сеть</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="bg-dark text-white">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                {% if user.is_authenticated %}
                    <a class="navbar-brand text-white" href="{% url 'dataset_list' %}">
                        {{ user.get_full_name|default:user.email }}
                    </a>
                {% else %}
                    <a class="navbar-brand text-white" href="{% url 'dataset_list' %}">DataSets Manager</a>
                {% endif %}
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
<!--                        {% if user.is_staff %}-->
<!--                            <li class="nav-item">-->
<!--                                <a class="nav-link text-white" href="{% url 'user_list' %}">Пользователи</a>-->
<!--                            </li>-->
<!--                        {% endif %}-->
                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'dataset_list' %}">Наборы данных</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'model_list' %}">Модели</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'session_list' %}">Обучение</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'predict_sessions_list' %}">Предсказание</a>
                        </li>
                        {% if user.is_authenticated %}
                            <li class="nav-item">
                                <a href="{% url 'logout' %}" class="btn btn-danger btn-block">
                                    Выйти
                                </a>
                            </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
