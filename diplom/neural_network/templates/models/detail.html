{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>{{ model.title }}</h4>
                </div>
                <div class="card-body">
                    <p class="card-text">{{ model.description }}</p>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <strong>Дата создания:</strong> 
                            {{ model.creation_date|date:"d.m.Y H:i" }}
                        </li>
                        <li class="list-group-item">
                            <strong>Параметры модели:</strong>
                            <pre class="mt-2 p-2 bg-light rounded">{{ model.formatted_parameters }}</pre>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Действия</h5>
                    <a href="{% url 'model_list' %}" class="btn btn-outline-secondary btn-block">
                        ← Назад к списку
                    </a>
                    <form method="post" action="{% url 'model_delete' model.pk %}" onsubmit="return confirm('Удалить эту модель и связанные сессии?');">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-block">Удалить модель</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
